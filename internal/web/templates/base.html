<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Trade Republic CSV Export{{end}}</title>
    <style nonce="{{.Nonce}}">
        :root {
            --bg: #ffffff;
            --bg-card: #f8f9fa;
            --text: #1a1a2e;
            --text-secondary: #6c757d;
            --primary: #0066ff;
            --primary-hover: #0052cc;
            --error: #dc3545;
            --success: #28a745;
            --border: #dee2e6;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e;
                --bg-card: #16213e;
                --text: #e8e8e8;
                --text-secondary: #a0a0b0;
                --primary: #4d9fff;
                --primary-hover: #3388ff;
                --error: #ff6b6b;
                --success: #51cf66;
                --border: #2a2a4a;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
            color: var(--text-secondary);
        }

        input[type="tel"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            min-height: 44px;
        }

        input:focus {
            outline: 2px solid var(--primary);
            outline-offset: -1px;
            border-color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            min-height: 44px;
            transition: background 0.15s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-success {
            background: var(--success);
        }

        .error-message {
            color: var(--error);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--error);
            background: color-mix(in srgb, var(--error) 10%, transparent);
        }

        .info-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .csv-preview {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.8125rem;
            line-height: 1.4;
            white-space: pre;
            margin-bottom: 1rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.5rem;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        {{block "content" .}}{{end}}
    </div>
</body>
</html>
